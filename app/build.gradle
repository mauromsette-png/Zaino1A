plugins {
    id 'com.android.application'
}

android {
    namespace 'it.scuola.zaino'
    compileSdk 35

    defaultConfig {
        applicationId 'it.scuola.zaino'
        minSdk 26          // Android 8.0
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// No external libraries: the app uses only the Android platform APIs.
